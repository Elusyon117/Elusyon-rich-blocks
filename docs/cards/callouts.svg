<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img"><title>Colored callouts: a reply with plain text and lines in orange, yellow, green, blue and purple: orange key point · yellow risk · green done · blue tip · purple next steps</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1c1a"/><stop offset="1" stop-color="#141312"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22c55e" stop-opacity="0.13"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141312" stop-opacity="0"/><stop offset="1" stop-color="#141312"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/></filter><clipPath id="card"><rect width="880" height="500" rx="16"/></clipPath></defs><g clip-path="url(#card)"><rect width="880" height="500" fill="url(#bg)"/><rect x="48" y="48" width="108" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/><text x="102" y="61" font-size="12.5" fill="#22c55e" font-family="Consolas, Menlo, monospace" text-anchor="middle" dominant-baseline="central">[[imp: ...]]</text><text x="48" y="118" font-size="30" font-weight="700" fill="#ececea">Colored callouts</text><text x="48" y="152" font-size="15" fill="#a3a29c">The lines worth finding again, colored by</text><text x="48" y="174" font-size="15" fill="#a3a29c">what they mean. Everything else in a reply</text><text x="48" y="196" font-size="15" fill="#a3a29c">looks as usual.</text><text x="48" y="238" font-size="14" fill="#22c55e" font-weight="700">›</text><text x="66" y="238" font-size="13.5" fill="#ececea">Orange: the key point</text><text x="48" y="268" font-size="14" fill="#22c55e" font-weight="700">›</text><text x="66" y="268" font-size="13.5" fill="#ececea">Yellow: a risk or caveat</text><text x="48" y="298" font-size="14" fill="#22c55e" font-weight="700">›</text><text x="66" y="298" font-size="13.5" fill="#ececea">Green: done or verified</text><text x="48" y="328" font-size="14" fill="#22c55e" font-weight="700">›</text><text x="66" y="328" font-size="13.5" fill="#ececea">Blue: a tip</text><text x="48" y="358" font-size="14" fill="#22c55e" font-weight="700">›</text><text x="66" y="358" font-size="13.5" fill="#ececea">Purple: Claude's next steps</text><ellipse cx="643.0" cy="250.0" rx="304.5" ry="300.0" fill="url(#glow)"/><rect x="440" y="103" width="406" height="294" rx="10" fill="#1a1a1a" stroke="#3d3c38" filter="url(#shadow)"/><text x="462" y="139" font-size="14.5" fill="#ececea" font-weight="400">The settings page is in place and the form</text><text x="462" y="160" font-size="14.5" fill="#ececea" font-weight="400">saves.</text><text x="462" y="200" font-size="14.5" fill="#22c55e" font-weight="600">Done: all 42 tests pass.</text><text x="462" y="240" font-size="14.5" fill="#f97316" font-weight="600">The API key goes in .env, never in the code.</text><text x="462" y="280" font-size="14.5" fill="#eab308" font-weight="600">Risk: the migration rewrites the users table.</text><text x="462" y="320" font-size="14.5" fill="#60a5fa" font-weight="600">Tip: run the tests with --watch while you work.</text><text x="462" y="360" font-size="14.5" fill="#a78bfa" font-weight="600">Next: I'll wire the page into the menu.</text></g><rect x="0.5" y="0.5" width="879" height="499" rx="16" fill="none" stroke="#3d3c38"/></svg>