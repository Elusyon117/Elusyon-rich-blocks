<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img" aria-label="rich-blocks logo: a pixel crab stacking green, red and yellow blocks beside the name">
  <rect x="0" y="0" width="680" height="260" rx="20" fill="#1f1e1d"/>

  <!-- Pixel scene, 17 x 9 cells of 14px: a Clawd-style crab placing a yellow
       block on a stack of red and green ones (Done, Failed, Skip). -->
  <g transform="translate(36 67) scale(14)" shape-rendering="crispEdges">
    <!-- the stack: green (Done) at the bottom, red (Failed) on it -->
    <rect x="14" y="6" width="3" height="3" fill="#22c55e"/>
    <rect x="14" y="8" width="3" height="1" fill="#16a34a"/>
    <rect x="14" y="3" width="3" height="3" fill="#ef4444"/>
    <rect x="14" y="5" width="3" height="1" fill="#dc2626"/>
    <!-- the yellow (Skip) block, held up and set on top -->
    <rect x="14" y="0" width="3" height="3" fill="#eab308"/>
    <rect x="14" y="2" width="3" height="1" fill="#ca8a04"/>

    <!-- the crab -->
    <g fill="#d97757">
      <rect x="3" y="0" width="8" height="2"/>
      <rect x="3" y="2" width="1" height="2"/>
      <rect x="5" y="2" width="4" height="2"/>
      <rect x="10" y="2" width="1" height="2"/>
      <!-- left arm, resting -->
      <rect x="1" y="3" width="2" height="2"/>
      <!-- right arm, raised to hold the yellow block -->
      <rect x="11" y="1" width="3" height="2"/>
      <rect x="3" y="4" width="8" height="3"/>
      <rect x="3" y="7" width="1" height="2"/>
      <rect x="5" y="7" width="1" height="2"/>
      <rect x="8" y="7" width="1" height="2"/>
      <rect x="10" y="7" width="1" height="2"/>
    </g>
    <rect x="4" y="2" width="1" height="2" fill="#1f1e1d"/>
    <rect x="9" y="2" width="1" height="2" fill="#1f1e1d"/>
  </g>

  <text x="304" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#faf9f5">rich-blocks</text>
  <text x="306" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa">Interactive blocks for Claude Code</text>
</svg>
